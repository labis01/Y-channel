<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  .frame{
    width:1280px;height:720px;position:relative;overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#0a0a0a;
  }
  .half{
    position:absolute; top:0; width:640px; height:720px; overflow:hidden;
  }
  .left{ left:0; background:radial-gradient(circle at 30% 20%, #a11414 0%, #6e0d0d 55%, #4a0808 100%); }
  .right{ left:640px; background:linear-gradient(160deg, #26364f 0%, #16202f 60%, #0c1219 100%); }

  /* ruler / mugshot lines */
  .ruler-line{ position:absolute; left:0; right:0; height:2px; background:rgba(255,255,255,0.22); }
  .ruler-label{
    position:absolute; left:14px; color:rgba(255,255,255,0.55); font-size:15px; font-weight:700;
    transform:translateY(-50%); letter-spacing:0.5px;
  }
  .right .ruler-label{ left:auto; right:14px; }

  /* web pattern on left */
  .web{ position:absolute; inset:0; opacity:0.35; }

  /* center seam */
  .seam{
    position:absolute; left:637px; top:0; width:6px; height:720px;
    background:linear-gradient(to bottom, #fff, #ddd 40%, #fff 60%, #ddd 100%);
    box-shadow:0 0 22px 4px rgba(255,255,255,0.5);
    z-index:5;
  }

  /* spider mask */
  .mask-wrap{ position:absolute; left:60px; top:60px; width:520px; height:600px; }

  /* L portrait */
  .l-wrap{ position:absolute; right:40px; top:70px; width:520px; height:590px; }

  .badge{
    position:absolute; right:26px; bottom:22px; z-index:10;
    background:rgba(0,0,0,0.72); color:#fff; font-weight:800; font-size:26px;
    padding:6px 16px; border-radius:20px; letter-spacing:1px;
  }
  .icon{
    position:absolute; left:22px; bottom:22px; z-index:10;
    width:70px; height:88px; background:#0d0d0d; border:2px solid #b3b3b3;
    border-radius:2px; box-shadow:0 6px 14px rgba(0,0,0,0.5);
  }
  .icon:before{
    content:"DEATH\A NOTE"; white-space:pre; position:absolute; top:14px; left:0; right:0;
    text-align:center; color:#e6c15a; font-size:9px; font-weight:800; letter-spacing:0.5px; line-height:1.5;
  }
</style>
</head>
<body>
<div class="frame">

  <div class="half left">
    <svg class="web" viewBox="0 0 640 720" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#ffffff" stroke-width="2" fill="none">
        <circle cx="0" cy="0" r="120"/><circle cx="0" cy="0" r="240"/><circle cx="0" cy="0" r="360"/><circle cx="0" cy="0" r="480"/><circle cx="0" cy="0" r="620"/>
        <line x1="0" y1="0" x2="640" y2="0"/>
        <line x1="0" y1="0" x2="640" y2="240"/>
        <line x1="0" y1="0" x2="640" y2="480"/>
        <line x1="0" y1="0" x2="640" y2="720"/>
        <line x1="0" y1="0" x2="320" y2="720"/>
        <line x1="0" y1="0" x2="0" y2="720"/>
      </g>
    </svg>

    <!-- ruler lines -->
    <div class="ruler-line" style="top:70px"></div><div class="ruler-label" style="top:70px">6'0"</div>
    <div class="ruler-line" style="top:170px"></div><div class="ruler-label" style="top:170px">5'6"</div>
    <div class="ruler-line" style="top:270px"></div><div class="ruler-label" style="top:270px">5'0"</div>
    <div class="ruler-line" style="top:370px"></div><div class="ruler-label" style="top:370px">4'6"</div>
    <div class="ruler-line" style="top:470px"></div><div class="ruler-label" style="top:470px">4'0"</div>
    <div class="ruler-line" style="top:570px"></div><div class="ruler-label" style="top:570px">3'6"</div>

    <div class="mask-wrap">
      <svg viewBox="0 0 520 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="maskGrad" cx="50%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#e23434"/>
            <stop offset="100%" stop-color="#8f1414"/>
          </radialGradient>
        </defs>
        <!-- mask head shape -->
        <path d="M260 40
                 C 130 40 60 150 60 300
                 C 60 460 150 560 260 560
                 C 370 560 460 460 460 300
                 C 460 150 390 40 260 40 Z"
              fill="url(#maskGrad)" stroke="#2a0505" stroke-width="6"/>
        <!-- web lines over mask -->
        <g stroke="#1c0303" stroke-width="3" fill="none" opacity="0.55">
          <path d="M260 40 C 200 150 200 450 260 560"/>
          <path d="M260 40 C 320 150 320 450 260 560"/>
          <path d="M100 160 C 200 200 320 200 420 160"/>
          <path d="M75 300 C 200 330 320 330 445 300"/>
          <path d="M100 440 C 200 400 320 400 420 440"/>
          <path d="M260 40 C 150 90 90 220 75 300"/>
          <path d="M260 40 C 370 90 430 220 445 300"/>
          <path d="M260 560 C 150 510 90 380 75 300"/>
          <path d="M260 560 C 370 510 430 380 445 300"/>
        </g>
        <!-- eyes: classic pointed lens shape, wide at outer top, tapered at inner bottom -->
        <path d="M245 285
                 C 245 255 235 205 195 175
                 C 150 143 100 150 90 190
                 C 82 222 100 250 130 270
                 C 165 293 215 300 245 285 Z"
              fill="#fefefe" stroke="#111" stroke-width="6"/>
        <path d="M275 285
                 C 275 255 285 205 325 175
                 C 370 143 420 150 430 190
                 C 438 222 420 250 390 270
                 C 355 293 305 300 275 285 Z"
              fill="#fefefe" stroke="#111" stroke-width="6"/>
        <g stroke="#111" stroke-width="3" fill="none" opacity="0.85">
          <path d="M110 190 C 150 210 190 240 235 270"/>
          <path d="M140 165 C 175 195 205 230 240 255"/>
          <path d="M410 190 C 370 210 330 240 285 270"/>
          <path d="M380 165 C 345 195 315 230 280 255"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="half right">
    <div class="ruler-line" style="top:70px"></div><div class="ruler-label" style="top:70px">6'0"</div>
    <div class="ruler-line" style="top:170px"></div><div class="ruler-label" style="top:170px">5'6"</div>
    <div class="ruler-line" style="top:270px"></div><div class="ruler-label" style="top:270px">5'0"</div>
    <div class="ruler-line" style="top:370px"></div><div class="ruler-label" style="top:370px">4'6"</div>
    <div class="ruler-line" style="top:470px"></div><div class="ruler-label" style="top:470px">4'0"</div>
    <div class="ruler-line" style="top:570px"></div><div class="ruler-label" style="top:570px">3'6"</div>

    <div class="l-wrap">
      <svg viewBox="0 0 520 590" xmlns="http://www.w3.org/2000/svg">
        <!-- hair back -->
        <path d="M120 260 C 90 140 170 40 270 40 C 380 40 440 140 410 270
                 C 440 250 460 300 430 330
                 C 410 260 400 250 380 260
                 C 390 180 340 110 265 110
                 C 190 110 145 175 150 260 Z"
              fill="#111417"/>
        <!-- face -->
        <ellipse cx="270" cy="300" rx="130" ry="150" fill="#e9e2d6"/>
        <!-- messy hair front spikes -->
        <g fill="#111417">
          <path d="M150 240 C 160 160 210 100 270 100 C 330 100 385 165 390 245
                   C 360 200 340 230 320 200
                   C 300 235 285 195 265 225
                   C 245 195 230 235 210 205
                   C 190 235 175 205 150 240 Z"/>
        </g>
        <!-- eyes: tired, dark circles -->
        <ellipse cx="225" cy="310" rx="34" ry="20" fill="#2a2a2a" opacity="0.28"/>
        <ellipse cx="325" cy="310" rx="34" ry="20" fill="#2a2a2a" opacity="0.28"/>
        <circle cx="228" cy="308" r="12" fill="#1a1a1a"/>
        <circle cx="322" cy="308" r="12" fill="#1a1a1a"/>
        <path d="M195 285 C 210 275 245 275 260 285" stroke="#1a1a1a" stroke-width="4" fill="none"/>
        <path d="M290 285 C 305 275 340 275 355 285" stroke="#1a1a1a" stroke-width="4" fill="none"/>
        <!-- flat mouth -->
        <path d="M235 385 C 260 395 290 395 315 385" stroke="#6b5a4a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- collar / suit hint -->
        <path d="M150 460 C 200 420 340 420 390 460 L 420 590 L 120 590 Z" fill="#0e0e10"/>
        <path d="M255 430 L 270 470 L 285 430 Z" fill="#f2f2f2"/>
      </svg>
    </div>
  </div>

  <div class="seam"></div>
  <div class="icon"></div>

</div>
</body>
</html>
